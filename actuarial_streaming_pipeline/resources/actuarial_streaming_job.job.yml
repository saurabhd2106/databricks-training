# Setup schema → land all sample CSVs → refresh streaming bronze pipeline.

resources:
  jobs:
    actuarial_streaming_job:
      name: actuarial_streaming_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: landing_path
          default: ${var.landing_volume_path}
        - name: source_path
          default: ${workspace.file_path}/fixtures/sample-data
        - name: claims_batch
          default: "all"

      tasks:
        - task_key: setup
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebooks/01_setup.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_name: landing

        - task_key: land_sample_data
          depends_on:
            - task_key: setup
          environment_key: default
          notebook_task:
            notebook_path: ../src/notebooks/land_sample_data.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              landing_path: "{{job.parameters.landing_path}}"
              source_path: "{{job.parameters.source_path}}"
              claims_batch: "{{job.parameters.claims_batch}}"

        - task_key: refresh_pipeline
          depends_on:
            - task_key: land_sample_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.actuarial_streaming_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
