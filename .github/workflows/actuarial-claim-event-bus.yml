# Test, validate, and deploy the actuarial_claim_event_bus Databricks Asset Bundle.
# Trigger manually via Actions → "Actuarial claim event bus" → Run workflow.
# Requires repo secrets: DATABRICKS_HOST, DATABRICKS_TOKEN
# Continuous pipeline start + data smoke need Event Hubs secrets configured in the workspace.
# See https://learn.microsoft.com/en-us/azure/databricks/dev-tools/ci-cd/github

name: Actuarial claim event bus

concurrency:
  group: actuarial-claim-event-bus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actuarial_claim_event_bus
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit and transform tests
        run: uv run pytest tests/ --ignore=tests/test_smoke_integration.py

  validate:
    name: Validate bundle
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actuarial_claim_event_bus
    steps:
      - uses: actions/checkout@v7

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.10.0

      - name: Validate
        run: databricks bundle validate --target prod

  deploy:
    name: Deploy bundle
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actuarial_claim_event_bus
    steps:
      - uses: actions/checkout@v7

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.10.0

      - name: Deploy
        run: databricks bundle deploy --target prod

  smoke:
    name: Smoke tests
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actuarial_claim_event_bus
    env:
      ACTUARIAL_TEST_CATALOG: actuarial
      ACTUARIAL_TEST_SCHEMA: event_bus
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Run post-deploy smoke tests
        run: uv run pytest tests/test_smoke_integration.py
        # Skips if Event Hubs pipeline has not created tables yet.
