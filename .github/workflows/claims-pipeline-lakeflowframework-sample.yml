# Test, validate, deploy, and run the claims_pipeline_lakeflowframework_sample Databricks Asset Bundle.
# Trigger manually via Actions → "Claims pipeline Lakeflow Framework sample" → Run workflow.
# Requires GitHub environment "dev" secrets: DATABRICKS_HOST, DATABRICKS_TOKEN
# Deploys Lakeview dashboards via bundle deploy (resources/*.dashboard.yml).
# See https://learn.microsoft.com/en-us/azure/databricks/dev-tools/ci-cd/github

name: Claims pipeline Lakeflow Framework sample

concurrency:
  group: claims-pipeline-lff-sample-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: claims_pipeline_lakeflowframework_sample
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run bundle config tests
        run: pytest tests/

  validate:
    name: Validate bundle
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: claims_pipeline_lakeflowframework_sample
    steps:
      - uses: actions/checkout@v7

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.10.0

      - name: Validate
        run: databricks bundle validate --target prod

  deploy_and_run:
    name: Deploy and run
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.10.0

      # Prod sample points at this path for framework.sourcePath.
      - name: Deploy Lakeflow Framework
        working-directory: lakeflow_framework
        run: databricks bundle deploy --target dev

      # Includes pipelines, job, volume, and all Lakeview dashboards.
      - name: Deploy claims LFF sample
        working-directory: claims_pipeline_lakeflowframework_sample
        run: databricks bundle deploy --target prod

      - name: Run claims_pipeline_job
        working-directory: claims_pipeline_lakeflowframework_sample
        run: databricks bundle run claims_pipeline_job --target prod
