# Validate, deploy, and run the claims_pipeline_saurabh Databricks Asset Bundle.
# See https://learn.microsoft.com/en-us/azure/databricks/dev-tools/ci-cd/github

name: Claims pipeline

concurrency:
  group: claims-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claims_pipeline_saurabh
    steps:
      - uses: actions/checkout@v7

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.10.0

      - name: Validate
        run: databricks bundle validate --target prod

  deploy_and_run:
    name: Deploy and run
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claims_pipeline_saurabh
    steps:
      - uses: actions/checkout@v7

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.10.0

      - name: Deploy
        run: databricks bundle deploy --target prod

      - name: Run claims_pipeline_job
        run: databricks bundle run claims_pipeline_job --target prod
