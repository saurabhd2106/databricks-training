# Land sample CSVs on the Terraform all-purpose cluster, then refresh the pipeline.

resources:
  jobs:
    claims_pipeline_job:
      name: claims_pipeline_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: landing_path
          default: ${var.landing_volume_path}
        - name: source_path
          default: ${workspace.file_path}/fixtures/sample-data

      tasks:
        - task_key: land_sample_data
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/land_sample_data.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              landing_path: "{{job.parameters.landing_path}}"
              source_path: "{{job.parameters.source_path}}"

        - task_key: refresh_pipeline
          depends_on:
            - task_key: land_sample_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.claims_pipeline_saurabh_etl.id}
