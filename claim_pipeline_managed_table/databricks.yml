# This is a Declarative Automation Bundle definition for claim_pipeline_managed_table.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: claim_pipeline_managed_table
  uuid: 3f65f5dc-af4b-4c19-9215-0ca2698cb71f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use (dev/prod for environment isolation)
  volume_name:
    description: Unity Catalog volume name for raw CSV landing
    default: raw_files
  bronze_write_mode:
    description: Spark write mode for bronze tables
    default: overwrite
  overwrite_schema:
    description: Whether bronze writes may overwrite table schema
    default: "true"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405611775215693.13.azuredatabricks.net
    variables:
      catalog: actuarial
      schema: dev
      bronze_write_mode: overwrite
      overwrite_schema: "true"
  prod:
    mode: production
    workspace:
      host: https://adb-7405611775215693.13.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/databricks-np@saurabhuptut.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/databricks-np@saurabhuptut.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: actuarial
      schema: prod
      bronze_write_mode: overwrite
      overwrite_schema: "false"
    permissions:
      - user_name: databricks-np@saurabhuptut.onmicrosoft.com
        level: CAN_MANAGE
