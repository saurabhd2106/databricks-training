# UC Volume for landing sample CSVs before bronze Auto Loader ingest.
# Requires catalog actuarial and schema sample to exist before deploy.

resources:
  volumes:
    actuarial_sample_landing:
      catalog_name: ${var.catalog}
      schema_name: ${var.bronze_schema}
      name: landing
      volume_type: MANAGED
      comment: Landing zone for claims sample CSVs (Lakeflow Framework bronze ingest).
