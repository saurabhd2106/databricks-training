# Create schemas → land CSVs → bronze → silver → gold.

resources:
  jobs:
    claims_pipeline_job:
      name: claims_lff_pipeline_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: landing_path
          default: ${var.landing_volume_path}
        - name: source_path
          default: ${workspace.file_path}/fixtures/sample-data

      tasks:
        - task_key: create_schemas_and_tables
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/notebooks/create_schemas_and_tables.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: land_sample_data
          depends_on:
            - task_key: create_schemas_and_tables
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/notebooks/land_sample_data.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              landing_path: "{{job.parameters.landing_path}}"
              source_path: "{{job.parameters.source_path}}"

        - task_key: bronze_pipeline
          depends_on:
            - task_key: land_sample_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.claims_bronze_pipeline.id}
            full_refresh: true

        - task_key: silver_pipeline
          depends_on:
            - task_key: bronze_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.claims_silver_pipeline.id}
            full_refresh: true

        - task_key: gold_pipeline
          depends_on:
            - task_key: silver_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.claims_gold_pipeline.id}
            full_refresh: true

      queue:
        enabled: true
