# Lakeflow Framework sample: actuarial claims medallion (bronze → silver → gold).
# Prerequisite: deploy lakeflow_framework so framework_source_path resolves.
bundle:
  name: claims_pipeline_lakeflowframework_sample

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog for this LFF sample (separate from actuarial)
  framework_source_path:
    description: Workspace path to the deployed lakeflow_framework src/ folder
  workspace_host:
    description: Workspace URL used for Framework API calls
  bronze_schema:
    description: UC schema name for the bronze layer (under catalog)
  silver_schema:
    description: UC schema name for the silver layer (under catalog)
  gold_schema:
    description: UC schema name for the gold layer (under catalog)
  cluster_id:
    description: Existing all-purpose cluster ID for land / setup notebooks
  landing_volume_path:
    description: UC Volume path where sample CSVs are landed for bronze ingest
  logical_env:
    description: Optional logical environment suffix for substitutions
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405611775215693.13.azuredatabricks.net
    variables:
      catalog: actuarial_lff
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      cluster_id: 0730-111218-jwuz715u
      landing_volume_path: /Volumes/actuarial_lff/bronze/landing
      workspace_host: https://adb-7405611775215693.13.azuredatabricks.net
      framework_source_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/lakeflow_framework/dev/current/files/src
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405611775215693.13.azuredatabricks.net
      root_path: /Workspace/Users/databricks-np@saurabhuptut.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: actuarial_lff
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      cluster_id: 0730-111218-jwuz715u
      landing_volume_path: /Volumes/actuarial_lff/bronze/landing
      workspace_host: https://adb-7405611775215693.13.azuredatabricks.net
      framework_source_path: /Workspace/Users/databricks-np@saurabhuptut.onmicrosoft.com/.bundle/lakeflow_framework/dev/current/files/src
    permissions:
      - user_name: databricks-np@saurabhuptut.onmicrosoft.com
        level: CAN_MANAGE
