expect_or_drop:
  - name: claim_category_not_null
    constraint: claim_category IS NOT NULL
    tag: Completeness
  - name: non_negative_claim_count
    constraint: claim_count >= 0
    tag: Validity
expect:
  - name: non_negative_total_incurred
    constraint: total_incurred >= 0
    tag: Validity
  - name: non_negative_total_paid
    constraint: total_paid >= 0
    tag: Validity
