# Silver: typed claims snapshots at grain (claim_id, snapshot_date)
dataFlowId: claims_snapshots
dataFlowGroup: claims_silver
dataFlowType: standard

sourceSystem: claims_bronze
sourceType: delta
sourceViewName: v_claims_bordereau
sourceDetails:
  database: '{bronze_schema}'
  table: claims_bordereau
  cdfEnabled: true
  selectExp:
    - cast(claim_id as string) as claim_id
    - cast(policy_id as string) as policy_id
    - cast(event_id as string) as event_id
    - to_date(date_of_loss) as date_of_loss
    - to_date(reported_date) as reported_date
    - cast(peril_type as string) as peril_type
    - cast(claim_status as string) as claim_status
    - cast(incurred_amount as decimal(18,2)) as incurred_amount
    - cast(paid_to_date as decimal(18,2)) as paid_to_date
    - to_date(snapshot_date) as snapshot_date
    - _ingest_ts
mode: stream

targetFormat: delta
targetDetails:
  database: '{silver_schema}'
  table: claims_snapshots
  comment: Typed claims snapshots at grain (claim_id, snapshot_date).
  tableProperties:
    delta.enableChangeDataFeed: 'true'
  schemaPath: claims_snapshots_schema.json

cdcSettings:
  keys:
    - claim_id
    - snapshot_date
  sequence_by: _ingest_ts
  scd_type: '1'
  ignore_null_updates: false
  except_column_list:
    - _ingest_ts

dataQualityExpectationsEnabled: true
dataQualityExpectationsPath: ./claims_snapshots_dqe.yaml
quarantineMode: table
quarantineTargetDetails:
  targetFormat: delta
  database: '{silver_schema}'
