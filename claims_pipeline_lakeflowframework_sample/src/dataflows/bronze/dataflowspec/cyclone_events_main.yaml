# Bronze: Auto Loader ingest of cyclone events CSVs
dataFlowId: cyclone_events
dataFlowGroup: claims_bronze
dataFlowType: standard

sourceSystem: claims_landing
sourceType: cloudFiles
sourceViewName: v_cyclone_events_files
sourceDetails:
  path: '{sample_file_location}/cyclone_events/'
  readerOptions:
    cloudFiles.format: csv
    header: 'true'
    cloudFiles.inferColumnTypes: 'false'
  schemaPath: cyclone_events_file_schema.json
  selectExp:
    - event_id
    - event_name
    - start_date
    - end_date
    - current_timestamp() AS _ingest_ts
    - _metadata.file_path AS _source_file
mode: stream

targetFormat: delta
targetDetails:
  database: '{bronze_schema}'
  # Prefixed so bronze and silver can share actuarial.sample without colliding.
  table: bronze_cyclone_events
  comment: Raw cyclone events CSV ingest.
  tableProperties:
    delta.enableChangeDataFeed: 'true'
  schemaPath: cyclone_events_schema.json

dataQualityExpectationsEnabled: true
dataQualityExpectationsPath: ./cyclone_events_dqe.yaml
quarantineMode: table
quarantineTargetDetails:
  targetFormat: delta
  database: '{bronze_schema}'
