[project]
name = "actuarial_claim_event_bus"
version = "0.0.1"
authors = [{ name = "databricks-np@saurabhuptut.onmicrosoft.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Pipeline dependencies belong in the pipeline.yml environment section.
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
    "pyyaml",
]

[project.scripts]
main = "actuarial_claim_event_bus.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actuarial_claim_event_bus"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
